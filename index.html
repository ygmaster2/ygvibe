<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YG 바이브 코딩 누리집</title>
<meta name="description" content="양곡고등학교 선생님들이 직접 만든 업무·학습 프로그램 모음">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E78">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YG 코딩">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // 테마 깜빡임 방지: 기본값은 다크모드, 사용자가 라이트모드를 선택한 적 있으면 그걸 따름
  if (localStorage.getItem("theme") !== "light") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
<style>
  :root {
    --navy: #1F4E78;
    --navy-dark: #163a5c;
    --accent: #2E75B6;
    --bg: #F4F6F9;
    --card-bg: #FFFFFF;
    --text: #2A2E33;
    --muted: #6B7280;
    --border: #E3E7ED;
    --badge-bg: #E8F1FA;
    --hover-bg: #EEF4FA;
    --btn-bg: #1F4E78;
    --btn-bg-hover: #163a5c;
    --card-shadow: rgba(31,78,120,0.12);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --navy: #7FC1F2;
    --navy-dark: #5FA8DE;
    --accent: #7FC1F2;
    --bg: #14171C;
    --card-bg: #1D2128;
    --text: #E7E9EC;
    --muted: #98A2AF;
    --border: #2B313A;
    --badge-bg: #1F3A52;
    --hover-bg: #223A50;
    --btn-bg: #2E75B6;
    --btn-bg-hover: #3A86C8;
    --card-shadow: rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .15s ease, color .15s ease;
  }
  header {
    position: relative;
    background: linear-gradient(135deg, #1F4E78, #163a5c);
    color: #fff;
    padding: 44px 32px 36px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 20px;
  }
  .header-main { flex: 1 1 320px; min-width: 0; }
  /* 헤더 버튼(다크모드·설치)과 겹치지 않도록 위쪽을 비워둠 */
  .header-side { flex: 0 1 480px; min-width: 340px; margin-top: 44px; }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 0; color: #cfe0ee; font-size: 14px; }
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 20px;
    font-size: 13px;
    color: #cfe0ee;
    flex-wrap: wrap;
  }
  .stats span b { color: #fff; font-size: 16px; }
  .header-actions {
    position: absolute;
    top: 24px;
    right: 32px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .hbtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 8px 14px;
    border-radius: 100px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .hbtn:hover { background: rgba(255,255,255,0.22); }
  .hbtn.primary { background: rgba(255,255,255,0.92); border-color: #fff; color: var(--navy-dark); }
  .hbtn.primary:hover { background: #fff; }
  #install-hint {
    position: absolute;
    top: 64px;
    right: 32px;
    max-width: 300px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 12.5px;
    line-height: 1.65;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    z-index: 5;
  }
  #install-hint b { color: var(--navy); }

  /* ── 새 버전 안내 띠 ──────────────────────────────── */
  #update-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--btn-bg);
    color: #fff;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  #update-banner button {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    border: none;
    border-radius: 100px;
    padding: 6px 14px;
    cursor: pointer;
  }
  #update-banner .refresh { background: rgba(255,255,255,0.92); color: var(--navy-dark); }
  #update-banner .refresh:hover { background: #fff; }
  #update-banner .dismiss { background: rgba(255,255,255,0.16); color: #fff; padding: 6px 10px; }
  #update-banner .dismiss:hover { background: rgba(255,255,255,0.28); }

  /* 본문 폭을 넓혀 한 줄에 카드가 4개까지 들어가도록 함 */
  main { max-width: 1360px; margin: 0 auto; padding: 32px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .toolbar input {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 260px;
    font-size: 14px;
    background: var(--card-bg);
    color: var(--text);
  }

  /* ── 업무 / 학습 탭 ────────────────────────────────── */
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .tab:hover { background: var(--hover-bg); color: var(--navy); }
  .tab[aria-selected="true"] {
    background: var(--btn-bg);
    border-color: var(--btn-bg);
    color: #fff;
  }
  .tab .cnt { opacity: .75; font-weight: 500; margin-left: 5px; }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty b { color: var(--navy); }

  /* 카드 최소 폭 280px + 본문 폭 1360px → 넓은 화면에서 4열 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .card:hover { box-shadow: 0 6px 18px var(--card-shadow); transform: translateY(-2px); }
  .card h3 { margin: 0 0 10px; font-size: 16.5px; line-height: 1.4; color: var(--navy); padding-right: 60px; }

  /* 최근 업데이트된 카드에 붙는 뱃지 (일정 기간 지나면 자동으로 사라짐) */
  .update-badge {
    position: absolute;
    top: 18px;
    right: 18px;
    background: #E4572E;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 100px;
    white-space: nowrap;
    letter-spacing: .2px;
    text-decoration: none;
  }
  a.update-badge:hover { background: #C9481F; }
  html[data-theme="dark"] .update-badge { background: #FF7A50; color: #1D1200; }
  html[data-theme="dark"] a.update-badge:hover { background: #FF9670; }

  /* ── 최근 업데이트 상시 섹션 (헤더 오른쪽 여백에 배치) ───────── */
  @keyframes ruPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(228,87,46,0.15), 0 4px 14px rgba(0,0,0,0.25); }
    50% { box-shadow: 0 0 0 7px rgba(228,87,46,0.28), 0 4px 14px rgba(0,0,0,0.25); }
  }
  .recent-updates {
    background: rgba(255,255,255,0.13);
    border: 2px solid rgba(228,87,46,0.6);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 0 0 3px rgba(228,87,46,0.15), 0 4px 14px rgba(0,0,0,0.25);
    animation: ruPulse 1.6s ease-in-out 2;
  }
  .recent-updates .ru-tag {
    display: inline-block;
    background: #E4572E;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .3px;
    padding: 2px 7px;
    border-radius: 100px;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .recent-updates .ru-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .recent-updates ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  /* 항목이 몇 개든 한 줄 높이는 고정 - 늘어나면 안쪽에서만 스크롤되고 헤더 자체는 늘어나지 않음 */
  .recent-updates.ru-expanded ul {
    max-height: 138px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 6px;
    /* 스크롤바를 얇게 - Firefox */
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.35) transparent;
  }
  /* 스크롤바를 얇게 - Chrome/Edge */
  .recent-updates.ru-expanded ul::-webkit-scrollbar { width: 6px; }
  .recent-updates.ru-expanded ul::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); border-radius: 100px; }
  .recent-updates.ru-expanded ul::-webkit-scrollbar-track { background: transparent; }
  .recent-updates li a {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    text-decoration: none;
    color: #fff;
    font-size: 12.5px;
    line-height: 1.5;
    cursor: pointer;
    padding: 5px 6px;
    margin: -5px -6px;
    border-radius: 6px;
    transition: background .12s ease;
  }
  .recent-updates li a:hover { background: rgba(255,255,255,0.14); }
  .recent-updates .ru-date {
    flex: none;
    color: rgba(255,255,255,0.6);
    font-size: 11.5px;
    min-width: 34px;
  }
  /* 프로그램명은 링크처럼 밑줄을 항상 보여줘서 "여기 누르면 된다"는 걸 바로 알 수 있게 함.
     내용이 길면(이름도 포함) 한 줄 안에서 말줄임표로 잘림 - 가로 스크롤이 생기지 않도록 */
  .recent-updates .ru-name {
    flex: 1 1 auto;
    min-width: 30px;
    max-width: max-content;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
    color: #fff;
    text-decoration: underline;
    text-decoration-color: rgba(255,255,255,0.35);
    text-underline-offset: 2px;
  }
  .recent-updates li a:hover .ru-name { text-decoration-color: #fff; }
  .recent-updates .ru-note {
    color: rgba(255,255,255,0.7);
    font-size: 11.5px;
    flex: 2 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .recent-updates .ru-arrow { flex: none; color: rgba(255,255,255,0.6); margin-left: 6px; font-size: 11.5px; }
  .recent-updates li.ru-hidden { display: none; }
  .recent-updates.ru-expanded li.ru-hidden { display: block; }
  .ru-toggle {
    display: block;
    background: none;
    border: none;
    color: rgba(255,255,255,0.75);
    font-size: 11.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 6px 0;
    margin-top: 2px;
  }
  .ru-toggle:hover { color: #fff; text-decoration: underline; }

  /* 설명은 기본 2줄까지만 보이고, 더보기로 펼침 */
  .card .desc {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.6;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .desc.expanded {
    display: block;
    overflow: visible;
  }
  .more-btn {
    align-self: flex-start;
    background: none;
    border: none;
    padding: 6px 0 0;
    margin: 0;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .more-btn:hover { text-decoration: underline; }

  .card .actions {
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 16px;
  }
  .card .actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    padding: 9px 0;
    border-radius: 7px;
    font-weight: 600;
  }
  .btn-primary { background: var(--btn-bg); color: #fff; }
  .btn-primary:hover { background: var(--btn-bg-hover); }
  .btn-secondary { background: var(--card-bg); color: var(--navy); border: 1px solid var(--navy); }
  .btn-secondary:hover { background: var(--hover-bg); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 30px;
  }
  @media (max-width: 640px) {
    header { padding: 32px 20px 28px; flex-direction: column; }
    header h1 { font-size: 22px; }
    /* 좁은 화면에서는 버튼을 제목 위에 나란히 배치 (제목과 겹치지 않도록) */
    .header-actions {
      position: static;
      justify-content: flex-start;
      margin-bottom: 16px;
    }
    #install-hint {
      position: static;
      max-width: none;
      margin: 0 0 16px;
    }
    /* 좁은 화면에서는 오른쪽 여백이 없으니, 최근 업데이트가 본문 위쪽에 자연스럽게 쌓임 */
    .header-side { margin-top: 18px; flex-basis: auto; min-width: 0; width: 100%; }
    main { padding: 22px 16px; }
    .toolbar input { width: 100%; }
  }
</style>
</head>
<body>

<div id="update-banner" hidden role="status">
  <span>🔄 누리집에 새 버전이 있습니다.</span>
  <button type="button" class="refresh" id="update-refresh-btn">지금 새로고침</button>
  <button type="button" class="dismiss" id="update-dismiss-btn" aria-label="닫기">✕</button>
</div>

<header>
  <div class="header-actions">
    <button id="install-btn" class="hbtn primary" type="button" hidden>⬇️ 앱 설치</button>
    <button id="theme-toggle" class="hbtn" type="button">🌙 다크모드</button>
  </div>
  <div id="install-hint" hidden></div>
  <div class="header-main">
    <h1>YG 바이브 코딩 누리집</h1>
    <p>선생님들이 바이브 코딩으로 만든 프로그램을 한 곳에 모았습니다.</p>
    <div class="stats">
      <span>등록된 프로그램 <b id="stat-count">0</b>개</span>
      <span>업무용 <b id="stat-work">0</b>개</span>
      <span>학습용 <b id="stat-study">0</b>개</span>
    </div>
  </div>
  <div class="header-side">
    <div id="recent-updates" class="recent-updates" hidden>
      <div class="ru-title"><span class="ru-tag">NEW</span>최근 업데이트 <span style="font-weight:400; color:rgba(255,255,255,.65);">· 프로그램명을 누르면 자세히 볼 수 있어요</span></div>
      <ul id="ru-list"></ul>
      <button type="button" id="ru-toggle" class="ru-toggle" hidden></button>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-cat="업무" aria-selected="true">업무용<span class="cnt" data-cnt="업무"></span></button>
      <button class="tab" type="button" role="tab" data-cat="학습" aria-selected="false">학습용<span class="cnt" data-cnt="학습"></span></button>
      <button class="tab" type="button" role="tab" data-cat="전체" aria-selected="false">전체<span class="cnt" data-cnt="전체"></span></button>
    </div>
    <input id="search" type="text" placeholder="프로그램 이름·설명으로 검색...">
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none;">
    <p><b>불러오는 중입니다...</b></p>
  </div>
</main>

<footer>업무는 덜고 수업은 채우기 위해, 선생님들이 직접 만들어 나눕니다 · 양곡고등학교</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  // 카드 데이터는 같은 폴더의 programs.csv 에서 읽어옵니다.
  // CSV 열 구성: ID, 구분(업무/학습), 프로그램명, 뱃지, 제작교사, 설명, 바로가기유형, 바로가기값, 매뉴얼파일명, 업데이트일, 업데이트내용, 업데이트파일명
  // (뱃지·제작교사는 자료 관리용으로만 보관하고 화면에는 표시하지 않습니다)
  // 업데이트일(YYYY-MM-DD)을 적어두면 ①최근 UPDATE_BADGE_DAYS일 동안 카드에 빨간 뱃지가 붙고,
  // ②헤더 오른쪽 "최근 업데이트" 목록에는 기간 제한 없이 계속(최신순으로) 남습니다.
  // 업데이트파일명(선택): 이번 업데이트를 자세히 정리한 안내 페이지를 update 폴더 안에 넣고
  // 그 파일명을 적으면, 뱃지와 "최근 업데이트" 목록이 매뉴얼 대신 그 페이지로 연결됩니다.
  // (같은 프로그램을 또 업데이트할 땐 새 파일을 만들지 말고, 그 안내 페이지 위에 새 날짜 항목을
  // 추가해서 하나의 파일에 업데이트 이력이 계속 쌓이도록 하는 걸 권장합니다.)

  const UPDATE_BADGE_DAYS = 14;         // 카드 뱃지가 붙어 있는 기간(일)
  const RECENT_UPDATES_COLLAPSED = 3;   // 기본으로 보여줄 개수 (나머지는 "더보기"로 펼침)

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const searchInput = document.getElementById("search");
  const tabsEl = document.getElementById("tabs");
  const recentUpdatesEl = document.getElementById("recent-updates");
  const ruList = document.getElementById("ru-list");
  const ruToggleBtn = document.getElementById("ru-toggle");

  ruToggleBtn.addEventListener("click", () => {
    const expanded = ruToggleBtn.dataset.expanded === "true";
    recentUpdatesEl.classList.toggle("ru-expanded", !expanded);
    ruToggleBtn.dataset.expanded = String(!expanded);
    ruToggleBtn.textContent = !expanded ? "접기" : `더보기 (+${ruToggleBtn.dataset.hiddenCount})`;
  });

  let programs = [];
  let currentCat = "업무";

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[ch]);
  }

  function parseUpdateDate(val) {
    if (val === null || val === undefined || val === "") return null;
    // CSV를 읽는 XLSX 라이브러리가 "2026-09-02" 같은 날짜 형식 글자를
    // 엑셀 일련번호(숫자, 예: 46267)로 자동 변환해버리는 경우가 있어 함께 처리합니다.
    if (typeof val === "number") {
      const utcDays = val - 25569; // 1970-01-01 기준 보정값
      const d = new Date(utcDays * 86400 * 1000);
      return isNaN(d.getTime()) ? null : d;
    }
    const s = val.toString().trim();
    if (!s) return null;
    const d = new Date(s + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function daysSince(date) {
    const ms = Date.now() - date.getTime();
    return Math.floor(ms / (1000 * 60 * 60 * 24));
  }

  function formatMD(date) {
    return `${date.getMonth() + 1}/${date.getDate()}`;
  }

  function visibleList() {
    const q = searchInput.value.trim().toLowerCase();
    return programs.filter(p => {
      const catOk = currentCat === "전체" || p.category === currentCat;
      if (!catOk) return false;
      if (!q) return true;
      return (p.name + " " + p.description).toLowerCase().includes(q);
    });
  }

  function render(list) {
    grid.innerHTML = "";
    if (list.length === 0) {
      empty.style.display = "block";
      empty.innerHTML = searchInput.value.trim()
        ? "<p><b>검색 결과가 없습니다.</b></p><p>다른 검색어를 입력하거나 다른 탭을 확인해보세요.</p>"
        : "<p><b>이 탭에 표시할 프로그램이 없습니다.</b></p>";
      grid.style.display = "none";
      return;
    }
    empty.style.display = "none";
    grid.style.display = "grid";

    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      const badgeLabel = `🆕 업데이트 ${formatMD(p.updatedAt || new Date())}`;
      const badgeHtml = !p.recentlyUpdated ? "" : (
        p.updateDoc
          ? `<a class="update-badge" href="${escapeHtml(p.updateDoc)}" target="yg_update_view">${badgeLabel}</a>`
          : `<span class="update-badge">${badgeLabel}</span>`
      );
      card.innerHTML = `
        ${badgeHtml}
        <h3>${escapeHtml(p.name)}</h3>
        <p class="desc">${escapeHtml(p.description)}</p>
        <div class="actions">
          <a class="btn-secondary" href="${escapeHtml(p.shortcut)}" target="_blank" rel="noopener">바로가기</a>
          <a class="btn-primary" href="${escapeHtml(p.manual)}" target="yg_manual_view">매뉴얼 보기</a>
        </div>
      `;
      grid.appendChild(card);
    });

    // 설명이 2줄을 넘는 카드에만 "더보기" 버튼을 붙임
    grid.querySelectorAll(".desc").forEach(desc => {
      if (desc.scrollHeight - desc.clientHeight > 2) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "more-btn";
        btn.textContent = "더보기";
        btn.addEventListener("click", () => {
          const open = desc.classList.toggle("expanded");
          btn.textContent = open ? "접기" : "더보기";
        });
        desc.insertAdjacentElement("afterend", btn);
      }
    });
  }

  function updateCounts() {
    const work = programs.filter(p => p.category === "업무").length;
    const study = programs.filter(p => p.category === "학습").length;
    document.getElementById("stat-count").textContent = programs.length;
    document.getElementById("stat-work").textContent = work;
    document.getElementById("stat-study").textContent = study;
    tabsEl.querySelector('[data-cnt="업무"]').textContent = work;
    tabsEl.querySelector('[data-cnt="학습"]').textContent = study;
    tabsEl.querySelector('[data-cnt="전체"]').textContent = programs.length;
  }

  function renderRecentUpdates() {
    const items = programs
      .filter(p => p.updatedAt)
      .sort((a, b) => b.updatedAt - a.updatedAt);

    if (items.length === 0) {
      recentUpdatesEl.hidden = true;
      return;
    }

    ruList.innerHTML = items.map((p, i) => `
      <li class="${i >= RECENT_UPDATES_COLLAPSED ? "ru-hidden" : ""}">
        <a href="${escapeHtml(p.updateDoc || p.manual)}" target="yg_update_view">
          <span class="ru-date">${formatMD(p.updatedAt)}</span>
          <span class="ru-name">${escapeHtml(p.name)}</span>
          ${p.updateNote ? `<span class="ru-note">- ${escapeHtml(p.updateNote)}</span>` : ""}
          <span class="ru-arrow">자세히 ›</span>
        </a>
      </li>
    `).join("");

    const hiddenCount = items.length - RECENT_UPDATES_COLLAPSED;
    recentUpdatesEl.classList.remove("ru-expanded");
    if (hiddenCount > 0) {
      ruToggleBtn.hidden = false;
      ruToggleBtn.dataset.expanded = "false";
      ruToggleBtn.dataset.hiddenCount = hiddenCount;
      ruToggleBtn.textContent = `더보기 (+${hiddenCount})`;
    } else {
      ruToggleBtn.hidden = true;
    }
    recentUpdatesEl.hidden = false;
  }

  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    currentCat = btn.dataset.cat;
    tabsEl.querySelectorAll(".tab").forEach(t => {
      t.setAttribute("aria-selected", t === btn ? "true" : "false");
    });
    render(visibleList());
  });

  searchInput.addEventListener("input", () => render(visibleList()));

  function decodeBestEffort(buffer) {
    const utf8Text = new TextDecoder("utf-8").decode(buffer);
    if (utf8Text.includes("프로그램명")) return utf8Text;
    try {
      const euckrText = new TextDecoder("euc-kr").decode(buffer);
      if (euckrText.includes("프로그램명")) return euckrText;
    } catch (e) {
      // 브라우저가 euc-kr 디코딩을 지원하지 않는 경우 무시
    }
    return utf8Text;
  }

  function showMessage(html) {
    grid.style.display = "none";
    grid.innerHTML = "";
    empty.style.display = "block";
    empty.innerHTML = html;
  }

  function filePickerHtml(extraNote) {
    return `
      <p><b>로컬 미리보기</b></p>
      <p>${extraNote || ""}</p>
      <input type="file" id="local-file-input" accept=".csv" style="margin-top:14px;">
    `;
  }

  function attachFilePicker(extraNote) {
    showMessage(filePickerHtml(extraNote));
    document.getElementById("local-file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const buffer = await file.arrayBuffer();
        const text = decodeBestEffort(buffer);
        applyCsvText(text, true);
      } catch (err) {
        attachFilePicker(`CSV 파일을 읽는 중 오류가 발생했습니다: ${err.message}`);
      }
    });
  }

  function applyCsvText(text, isLocalPicker) {
    const workbook = XLSX.read(text, { type: "string" });
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

    programs = rows
      .filter(r => (r["프로그램명"] || "").toString().trim() !== "")
      .map(r => {
        const shortcutType = (r["바로가기유형"] || "").toString().trim();
        const shortcutValue = (r["바로가기값"] || "").toString().trim();
        // 폴더 유형: programs 폴더 안 파일명만 적으면 경로 자동 완성
        // URL 유형: 입력한 주소를 그대로 사용
        const shortcut = shortcutType === "URL"
          ? (shortcutValue || "#")
          : (shortcutValue ? "programs/" + shortcutValue : "#");
        const category = (r["구분"] || "").toString().trim();
        const updatedAt = parseUpdateDate(r["업데이트일"]);
        return {
          id: (r["ID"] || "").toString().trim(),
          category,                       // 업무 / 학습 (탭 구분에 사용)
          name: r["프로그램명"],
          badge: r["뱃지"] || "",         // 자료 관리용 (화면 미표시)
          author: r["제작교사"] || "",    // 자료 관리용 (화면 미표시)
          description: r["설명"] || "",
          shortcut,
          manual: r["매뉴얼파일명"] ? ("manuals/" + r["매뉴얼파일명"]) : "#",
          updatedAt,
          updateNote: (r["업데이트내용"] || "").toString().trim(),
          // 업데이트파일명(선택): 이번에 뭐가 바뀌었는지 따로 정리한 안내 페이지가 있으면 그리로,
          // 없으면 기존 매뉴얼로 연결합니다.
          updateDoc: r["업데이트파일명"] ? ("update/" + r["업데이트파일명"]) : "",
          // 기간 제한 없이 계속 뱃지를 붙이되, 아직 오지 않은 미래 날짜만 안전하게 걸러냅니다.
          // daysSince가 -2 이상이면 통과시켜서, 컴퓨터 시계가 하루이틀 어긋나 있어도
          // 방금 입력한 업데이트일이 "미래"로 취급되어 뱃지가 안 뜨는 일이 없도록 여유를 둠
          recentlyUpdated: !!updatedAt && daysSince(updatedAt) <= UPDATE_BADGE_DAYS && daysSince(updatedAt) >= -2,
        };
      });

    updateCounts();
    renderRecentUpdates();

    if (programs.length === 0) {
      const noteBase = `${rows.length}개 행을 읽었지만, "프로그램명" 열에 값이 있는 행을 찾지 못했습니다.<br>
        헤더 이름(ID, 구분, 프로그램명, 뱃지, 제작교사, 설명, 바로가기유형, 바로가기값, 매뉴얼파일명)이 정확히 유지되어 있는지,<br>
        저장할 때 CSV(쉼표로 분리) 형식을 선택했는지 확인해주세요.`;
      if (isLocalPicker) {
        attachFilePicker(noteBase + "<br>다른 파일을 다시 선택할 수 있습니다.");
      } else {
        showMessage(`<p><b>표시할 프로그램이 없습니다.</b></p><p>${noteBase}</p>`);
      }
      return;
    }

    render(visibleList());
  }

  function showLocalPreviewPicker() {
    attachFilePicker(
      `이 화면을 파일로 직접 열면(file://) 브라우저 보안 정책 때문에
      programs.csv를 자동으로 불러오지 못해요. 아래에서 그 파일을 직접 선택하면
      지금 상태로 미리 볼 수 있습니다. (GitHub Pages에 올리면 이 안내 없이 자동으로 불러와집니다)`
    );
  }

  async function loadPrograms() {
    try {
      // 주소 뒤에 시각을 붙이고 캐시를 끄면, 깃허브 페이지가 예전 CSV를 물고 있어도
      // 항상 최신 목록을 불러옵니다. (새 프로그램을 등록했는데 안 보이는 문제 방지)
      const res = await fetch("programs.csv?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("fetch failed: " + res.status);
      const buffer = await res.arrayBuffer();
      const text = decodeBestEffort(buffer);
      applyCsvText(text);
    } catch (err) {
      showLocalPreviewPicker();
    }
  }

  loadPrograms();

  // ── 다크모드 토글 ──────────────────────────────────────────
  const themeToggleBtn = document.getElementById("theme-toggle");
  function updateToggleLabel() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    themeToggleBtn.textContent = isDark ? "☀️ 라이트모드" : "🌙 다크모드";
  }
  themeToggleBtn.addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    if (isDark) {
      document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("theme", "light");
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
      localStorage.setItem("theme", "dark");
    }
    updateToggleLabel();
  });
  updateToggleLabel();

  // ── 앱 설치(PWA) ───────────────────────────────────────────
  const installBtn = document.getElementById("install-btn");
  const installHint = document.getElementById("install-hint");
  let deferredPrompt = null;

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
  const isIOS =
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function showHint(html) {
    installHint.innerHTML = html;
    installHint.hidden = false;
  }

  // 크롬·엣지 계열: 설치 조건이 갖춰지면 브라우저가 이 이벤트를 보냄
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone) installBtn.hidden = false;
  });

  // 아이폰·아이패드는 설치 버튼을 지원하지 않아 직접 안내
  if (isIOS && !isStandalone) {
    installBtn.hidden = false;
    installBtn.textContent = "📲 홈 화면에 추가";
  }

  installBtn.addEventListener("click", async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
      return;
    }
    if (!installHint.hidden) { installHint.hidden = true; return; }
    showHint(
      isIOS
        ? `<b>홈 화면에 추가하는 방법</b><br>
           사파리 아래쪽 <b>공유 버튼(⬆️)</b>을 누른 뒤,
           목록에서 <b>"홈 화면에 추가"</b>를 선택하세요.
           그러면 앱처럼 아이콘이 생깁니다.`
        : `<b>설치하는 방법</b><br>
           주소창 오른쪽 끝의 <b>설치 아이콘</b>을 누르거나,
           브라우저 메뉴(⋮)에서 <b>"앱 설치"</b> 또는 <b>"바로가기 만들기"</b>를 선택하세요.`
    );
  });

  installHint.addEventListener("click", () => { installHint.hidden = true; });

  window.addEventListener("appinstalled", () => {
    installBtn.hidden = true;
    installHint.hidden = true;
    deferredPrompt = null;
  });

  // ── 서비스 워커 등록 + 새 버전 안내 ──────────────────────────
  const updateBanner = document.getElementById("update-banner");
  const updateRefreshBtn = document.getElementById("update-refresh-btn");
  const updateDismissBtn = document.getElementById("update-dismiss-btn");
  let swRefreshing = false;

  function showUpdateBanner(registration) {
    updateBanner.hidden = false;
    updateRefreshBtn.onclick = () => {
      // 대기 중인 새 서비스 워커에게 "지금 넘어가도 된다"는 신호를 보냄
      if (registration.waiting) registration.waiting.postMessage("SKIP_WAITING");
    };
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        // 예전에 열어둔 채 새 버전이 조용히 설치되어 대기 중이던 경우
        if (registration.waiting && navigator.serviceWorker.controller) {
          showUpdateBanner(registration);
        }
        // 지금 이 화면을 보는 동안 새 버전이 새로 감지된 경우
        registration.addEventListener("updatefound", () => {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              showUpdateBanner(registration);
            }
          });
        });
        // 앱을 오래 켜두는 경우를 위해, 화면이 다시 보일 때마다 새 버전이 있는지 확인
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") registration.update().catch(() => {});
        });
      }).catch(() => {
        // 로컬 파일(file://)로 열면 등록되지 않지만 화면 동작에는 문제 없음
      });

      // "지금 새로고침"을 눌러 새 서비스 워커가 실제로 넘겨받으면 화면을 다시 불러옴
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
      });
    });
  }

  updateDismissBtn.addEventListener("click", () => { updateBanner.hidden = true; });
</script>

</body>
</html>
